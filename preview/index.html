:root{
  --ink:#2A1F2E; --ink-2:#5E5265; --ink-3:#6B5F72; --line:rgba(42,31,46,.09);
  --panel:rgba(255,253,250,.94); --panel-solid:#FFFDFA; --chip:rgba(42,31,46,.06);--tile:rgba(42,31,46,.035); --chip-2:rgba(42,31,46,.11); --on:#2A1F2E; --on-ink:#FFFDFA;
  --accent:#F06051; --good:#5FAE55; --maid:#E6DDF0; --maid-i:#5B4670;
  --shadow:0 1px 2px rgba(42,31,46,.05),0 14px 34px rgba(42,31,46,.10);
  --font:"Figtree",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sky-ink:var(--ink);--sky-ink-2:var(--ink-2);--sky-on:var(--on);--sky-on-ink:var(--on-ink);--sky-chip:var(--chip)
}
:root[data-night="1"]{--ink:#FFF8F0;--ink-2:rgba(255,248,240,.86);--ink-3:rgba(255,248,240,.72);--line:rgba(255,248,240,.14);--panel:rgba(50,38,61,.96);--panel-solid:#34283F;--chip:rgba(255,248,240,.12);--tile:rgba(255,248,240,.07);--chip-2:rgba(255,248,240,.2);--on:#FFF3E6;--on-ink:#2A1F2E;--accent:#F2766A;--maid:rgba(156,127,196,.2);--maid-i:#D9C9EE;--shadow:0 1px 2px rgba(0,0,0,.2),0 14px 34px rgba(0,0,0,.35)}
:root[data-night="1"] .it.cur{background:rgba(120,200,110,.16)} :root[data-night="1"] .it.cur .tm{color:#9ED49A} :root[data-night="1"] .it.cur .lb{color:#FFF3E6}
:root[data-night="1"] #settings,:root[data-night="1"] #sheet{background:#1F1727} :root[data-night="1"] #settings .sethead,:root[data-night="1"] #sheet .sethead{background:linear-gradient(#1F1727 75%,rgba(31,23,39,0))}
:root[data-night="1"] .st .bar{background:rgba(255,243,230,.12)} :root[data-night="1"] .toast button{color:#C8463A} :root[data-night="1"] .dock>div{box-shadow:0 10px 36px rgba(0,0,0,.5)} :root[data-night="1"] .mk.feed{background:rgba(233,185,73,.2)} :root[data-night="1"] .mk.nanny{background:rgba(79,163,110,.2)} :root[data-night="1"] .mk.drv{background:rgba(124,138,166,.22)} :root[data-night="1"] .mk.maid{background:rgba(156,127,196,.22)}
:root[data-night="1"][data-sky="light"]{--sky-ink:#2A1F2E;--sky-ink-2:rgba(42,31,46,.8);--sky-on:#2A1F2E;--sky-on-ink:#FFF6EC;--sky-chip:rgba(42,31,46,.12)}
:root[data-sky="dark"]{--sky-ink:#FFF6EC;--sky-ink-2:rgba(255,246,236,.86);--sky-on:#FFF6EC;--sky-on-ink:#2A1F2E;--sky-chip:rgba(255,255,255,.16)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;color-scheme:light;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:#F5EFE8;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right));padding-block:var(--padt) 48px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:contain}
@media (display-mode:standalone){:root{--padt:calc(var(--sat) + 34px)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .18s var(--ease),background .18s var(--ease),color .18s var(--ease),opacity .18s var(--ease),box-shadow .18s var(--ease)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.wrap{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
/* earlier cards paint above later cards' shadows */
.wrap>*{position:relative} .wrap>:nth-child(1){z-index:9} .wrap>:nth-child(2){z-index:8} .wrap>:nth-child(3){z-index:7} .wrap>:nth-child(4){z-index:6} .wrap>:nth-child(5){z-index:5} .wrap>:nth-child(6){z-index:4} .wrap>:nth-child(7){z-index:3} .wrap>:nth-child(8){z-index:2}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:2px 4px 4px}
.top h1{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1;color:var(--sky-ink);font-variant-numeric:tabular-nums}
.top>div:first-child{min-width:0}
.top small{display:block;font-size:12.5px;font-weight:400;color:var(--sky-ink-2);margin-top:4px;line-height:1.3}
.top small button{color:var(--sky-ink-2);text-decoration:underline;text-underline-offset:3px;font-size:12.5px;margin-left:6px}
.wknav{display:flex;gap:2px}
.wknav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:18px}
.wknav button:active{background:var(--chip-2)}
.wknav #wkToday{font-size:9px;color:var(--accent)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap;text-align:center}
.seg button.on{background:var(--on);color:var(--on-ink);box-shadow:0 2px 8px rgba(42,31,46,.18)}
.seg,.state{position:relative} .seg>button,.state>button{position:relative;z-index:1} .seg.pilled>button.on,.state.pilled>button.on{background:transparent;box-shadow:none}
.pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--on);box-shadow:0 2px 8px rgba(42,31,46,.18);z-index:0;pointer-events:none}
.top .pill{background:var(--sky-on)}
.seg button[disabled]{opacity:.35;cursor:default}
.seg.sm button{padding:6px 10px;font-size:13px}
.top .seg{background:var(--sky-chip)} .top .seg button{color:var(--sky-ink-2)} .top .seg button.on{background:var(--sky-on);color:var(--sky-on-ink)}

.card{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:var(--shadow);padding:16px 16px;animation:rise .35s var(--ease) both}
